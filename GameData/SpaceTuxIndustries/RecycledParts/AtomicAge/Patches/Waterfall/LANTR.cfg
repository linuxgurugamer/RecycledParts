@PART[nuclearEngineLANTR]:NEEDS[Waterfall]
{
	!fx_exhaustFlame_blue = DELETE
	!fx_exhaustLight_blue = DELETE
	!fx_smokeTrail_light = DELETE
	!sound_vent_medium = DELETE
	!sound_rocket_hard = DELETE
	!sound_vent_soft = DELETE
	!sound_explosion_low = DELETE
	// Removes the stock effect block, and replace it with one that has no particles
	@EFFECTS
	{
		@engage
		{
			!AUDIO {}
			AUDIO
			{
				channel = Ship
				clip = Waterfall/Sounds/KW/sound_liq7
				volume = 0.6
				pitch = 0.7
				loop = false
			}
		}
		@fx-nerv-running
		{
			!MODEL_MULTI_PARTICLE {}
		}
		@fx-reliant-running
		{
			!MODEL_MULTI_PARTICLE {}
		}
	}
  
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = nukeFX

		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = #$/MODULE[ModuleEnginesFX],0/engineID$
			responseRateUp = 0.03
			responseRateDown = 0.2
		}

		CONTROLLER
		{
			name = random1
			linkedTo = random
			noiseType = perlin
			scale = 0.5
			minimum = -0.5
			speed = 8
			seed = 15
		}
		CONTROLLER
		{
			name = random2
			linkedTo = random
			noiseType = perlin
			scale = 0.5
			minimum = -0.5
			speed = 10
			seed = 15
		}

		TEMPLATE
		{
			templateName = ntr_swe
			overrideParentTransform = thrustTransform
			scale = 0.94 , 0.94, 0.94
			rotation = 0, 0, 0
			position = 0, 0, -0.86
		}

		TEMPLATE
		{
			templateName = ntr_core_swe
			overrideParentTransform = thrustTransform
			scale = 0.92 , 0.92, 0.92
			rotation = 0, 0, 0
			position = 0, 0, -0.84
		}
	}
  
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = chemFX

		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = #$/MODULE[ModuleEnginesFX],1/engineID$
			responseRateUp = 0.03
			responseRateDown = 0.2
		}
		CONTROLLER
		{
			name = random1
			linkedTo = random
			noiseType = perlin
			scale = 0.5
			minimum = -0.5
			speed = 8
			seed = 15
		}
		CONTROLLER
		{
			name = random2
			linkedTo = random
			noiseType = perlin
			scale = 0.5
			minimum = -0.5
			speed = 10
			seed = 15
		}

		TEMPLATE
		{
			templateName = waterfall-hydrolox-upper-1
			overrideParentTransform = thrustTransform
			scale = 0.64 , 0.64, 0.64
			rotation = 0, 0, 0
			position = 0, 0, -0.09
		}
	}
}